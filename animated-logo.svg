<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background color matching the dark aesthetic -->
    <rect id="bg" width="400" height="400" fill="#0d1117" rx="50%" />
    
    <!-- Circular path for the text to follow -->
    <path id="text-path" 
          d="M 200, 200 m -140, 0 a 140,140 0 1,1 280,0 a 140,140 0 1,1 -280,0" 
          fill="none" />
  </defs>

  <!-- Background Circle -->
  <use href="#bg" />

  <!-- Optional: Subtle grid lines to match the reference image -->
  <g stroke="#1f242c" stroke-width="1" opacity="0.5">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
  </g>

  <!-- Rotating Text Group -->
  <g>
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 200 200" 
      to="360 200 200" 
      dur="20s" 
      repeatCount="indefinite" />
    
    <text fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" letter-spacing="6">
      <textPath href="#text-path" startOffset="0%">
        INNOVATE · CODE · DEPLOY · SCALE · REPEAT ·
      </textPath>
    </text>
  </g>

  <!-- Center Decoration (Optional: mimics the bottle/logo center) -->
  <circle cx="200" cy="200" r="60" fill="#0d1117" stroke="#c5a059" stroke-width="2" />
  <text x="200" y="205" fill="#c5a059" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">
    NEXIVO
  </text>
</svg>
